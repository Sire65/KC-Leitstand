# Veroeffentlichung des Leitstands auf GitHub Pages.
#
# Veroeffentlicht wird ausschliesslich public/ - der Auslieferungsstand. Und
# nur, wenn er die Pflichtpruefungen besteht: ein Stand, der den Release-Check
# oder den Framework-TUEV nicht besteht, geht nicht online. Deshalb laufen die
# Pruefungen hier noch einmal und nicht nur in "Validate Candidate": eine
# gruene Pruefung auf einem anderen Lauf ist keine Zusage fuer diesen.
name: GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Zwei Veroeffentlichungen gleichzeitig wuerden sich gegenseitig ueberholen.
# Der spaetere Stand gewinnt, der laufende wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    name: Pflichtpruefungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript-Syntax
        run: |
          node --check app/app.js
          node --check app/update.js
          node --check public/app.js
          node --check public/update.js
      - name: Aktualisierungshinweis
        run: node tests/update-selbsttest.mjs
      - name: Release readiness
        run: python tools/release-check.py
      - name: Framework TÜV Pflichtprüfung
        run: python tools/framework-tuev.py release --level CANDIDATE
      - name: TÜV-Zertifikat verifizieren
        run: python tools/framework-tuev.py verify

  # Freischalten muss in einem eigenen Auftrag ohne environment-Angabe
  # geschehen: solange Pages nicht auf "GitHub Actions" steht, gibt es die
  # Umgebung github-pages nicht, und ein Auftrag, der sie nennt, scheitert
  # sofort - noch bevor der erste Schritt laeuft und etwas freischalten
  # koennte. Erst freischalten, dann veroeffentlichen.
  freischalten:
    name: Pages freischalten
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: freischalten
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      # Der Arbeitsablauf-Token darf Pages nicht von sich aus anlegen
      # ("Resource not accessible by integration"). Das ist eine Einstellung
      # des Repositorys und bleibt eine bewusste Handlung eines Menschen.
      # Statt einer kryptischen Fehlermeldung steht hier, was zu tun ist.
      - name: Hinweis, falls Pages noch nicht eingeschaltet ist
        if: steps.freischalten.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages ist fuer dieses Repository noch nicht eingeschaltet."
          echo ""
          echo "Einmalig von Hand einschalten:"
          echo "  Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
          echo ""
          echo "Danach veroeffentlicht dieser Ablauf bei jedem Push auf main von selbst."
          exit 1

  deploy:
    name: Veröffentlichen
    needs: freischalten
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
