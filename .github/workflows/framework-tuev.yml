name: Framework TÜV

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  candidate-tuev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Automatischer Framework TÜV
        run: python tools/framework-tuev.py release --level CANDIDATE
      - name: Zertifikat verifizieren
        run: python tools/framework-tuev.py verify
      - name: TÜV-Berichte archivieren
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framework-tuev-report
          path: |
            tuev/report.json
            tuev/report.html
            tuev/failures.json
            tuev/certificate.json
            tuev/certificate.txt
