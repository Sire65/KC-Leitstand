name: Validate Candidate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: node --check app/app.js
      - name: Aktualisierungshinweis
        run: |
          node --check app/update.js
          node tests/update-selbsttest.mjs
      - name: Migration preflight
        run: python tools/migration-preflight.py
      - name: Release readiness
        run: python tools/release-check.py
      - name: Framework TÜV Pflichtprüfung
        run: python tools/framework-tuev.py release --level CANDIDATE
      - name: TÜV-Zertifikat verifizieren
        run: python tools/framework-tuev.py verify
